<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表里之介 · 构成主义魔幻海报</title>
<style>
  :root {
    --red: #d93025;
    --red-deep: #9c1912;
    --ink: #0b0b10;
    --cream: #f3ead8;
    --gold: #e8c265;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #05060a;
    font-family: "Noto Sans SC", "思源黑体", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 40px 24px;
  }
  .stage {
    position: relative; width: min(800px, 92vw); aspect-ratio: 2 / 3; overflow: hidden;
    background: #000; box-shadow: 0 40px 90px rgba(0,0,0,0.7);
  }

  .bg { position: absolute; inset: 0; background-size: cover; background-position: center 30%; }

  .tint {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(8,12,24,0.5) 0%, rgba(10,16,32,0.12) 42%, rgba(6,8,16,0.66) 100%),
      radial-gradient(120% 80% at 50% 40%, transparent 40%, rgba(4,5,10,0.6) 100%);
  }

  /* constructivist radial burst */
  .rays {
    position: absolute; inset: -30%;
    background: repeating-conic-gradient(from 176deg at 50% 32%,
      rgba(232,194,101,0.15) 0deg 3deg, rgba(232,194,101,0) 3deg 13deg);
    mix-blend-mode: screen; opacity: .75;
  }

  /* CONSTRUCTIVIST GEOMETRY — now interlocking with title */
  .geo { position: absolute; z-index: 3; }

  /* big triangle cutting top-left, edge slashes down past the title */
  .geo-tri {
    top:-8px; left:-6px; width: 0; height: 0;
    border-top: 300px solid var(--red); border-right: 430px solid transparent;
    opacity: .95;
  }

  /* diagonal red band — frames the title, sweeps down to the disc (constructivist slash) */
  .geo-band {
    top: 62%; left: -12%; width: 132%; height: 9px;
    background: var(--red-deep); transform: rotate(-16deg); opacity: .85; z-index: 3;
  }

  /* large red disc bottom-right, extends off-frame */
  .geo-disc {
    bottom: -120px; right: -120px; width: 380px; height: 380px; border-radius: 50%;
    background: var(--red); opacity: .92;
  }

  /* cream ring — gate / boundary */
  .geo-ring { top: 15%; right: 7%; width: 96px; height: 96px; border-radius: 50%; border: 3px solid var(--cream); opacity: .45; }

  /* top rules */
  .geo-slab { top: 0; right: 0; width: 52%; height: 12px; background: var(--ink); }
  .geo-slab2 { top: 12px; right: 0; width: 34%; height: 3px; background: var(--cream); opacity: .6; }

  /* ORGANIC GOLD SWIRL — the "organic / alive" layer */
  .swirl { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .95; z-index: 2; }

  /* TOP BAND */
  .topband { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 26px 30px; z-index: 5; }
  .topband .l { font-size: 12px; letter-spacing: .5em; color: var(--cream); text-transform: uppercase; }
  .topband .r { font-size: 12px; letter-spacing: .3em; color: var(--gold); text-shadow: 0 1px 6px rgba(0,0,0,.7); }

  /* MAIN TITLE — flat constructivist, interlocking with the red triangle */
  .titlewrap { position: absolute; left: 40px; top: 47%; transform: translateY(-50%); z-index: 6; }
  .title-en {
    font-size: clamp(15px, 2.4vw, 24px); font-weight: 800; letter-spacing: .4em;
    color: var(--cream); margin-bottom: 8px; text-transform: uppercase;
    text-shadow: 0 2px 0 var(--red-deep), 0 4px 10px rgba(0,0,0,.6);
  }
  .title-main {
    font-size: clamp(72px, 13vw, 134px); font-weight: 900; line-height: .92; letter-spacing: .01em;
    color: var(--cream); transform: rotate(-6deg); transform-origin: left center;
    /* flat but grounded — thin dark keyline + soft depth, not glossy 3D */
    text-shadow: 0 3px 0 rgba(0,0,0,.35);
    position: relative;
  }
  /* red block behind part of the title for interlock */
  .title-main::after {
    content: ""; position: absolute; left: 6%; top: 30%; width: 34%; height: 78%;
    background: var(--red); z-index: -1; mix-blend-mode: multiply; opacity: .28;
  }
  .title-main .sub {
    display: block; font-size: .32em; font-weight: 700; letter-spacing: .46em; color: var(--gold);
    margin-top: 16px; transform: rotate(-6deg); text-shadow: 0 1px 8px rgba(0,0,0,.7);
  }

  /* STORY TAGLINE — clean, low-count text */
  .tagline { position: absolute; left: 40px; bottom: 78px; z-index: 6; }
  .rule { width: 58px; height: 4px; background: var(--red); margin: 0 0 13px; }
  .tagline .txt { padding: 12px 14px; background: rgba(6,8,16,0.42); border-left: 3px solid var(--red); backdrop-filter: blur(2px); }
  .tagline .ln { font-size: 14.5px; line-height: 1.75; color: var(--cream); letter-spacing: .14em; }
  .tagline .ln b { color: var(--gold); font-weight: 700; }

  /* bottom credits — moved clear of the disc */
  .credits { position: absolute; left: 40px; bottom: 24px; z-index: 6; display: flex; gap: 22px; align-items: baseline; }
  .credits .c { font-size: 12px; color: var(--cream); opacity: .92; letter-spacing: .14em; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  .credits .ce { font-size: 11px; color: var(--gold); letter-spacing: .24em; text-transform: uppercase; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
</style>
</head>
<body>
<div class="stage">
  <div class="bg" style="background-image:url('assets/底图_浮空城.png')"></div>
  <div class="tint"></div>
  <div class="rays"></div>

  <!-- constructivist geometry -->
  <div class="geo geo-tri"></div>
  <div class="geo geo-band"></div>
  <div class="geo geo-disc"></div>
  <div class="geo geo-ring"></div>
  <div class="geo geo-slab"></div>
  <div class="geo geo-slab2"></div>

  <!-- organic gold swirl -->
  <svg class="swirl" viewBox="0 0 800 1200" preserveAspectRatio="none">
    <path d="M-40,340 C180,120 520,80 820,240" fill="none" stroke="var(--gold)" stroke-width="1.4" opacity=".5"/>
    <path d="M-40,390 C200,180 540,150 830,310" fill="none" stroke="var(--gold)" stroke-width="0.8" opacity=".32"/>
    <path d="M620,-30 C700,180 560,430 700,680" fill="none" stroke="var(--cream)" stroke-width="1" opacity=".38"/>
    <path d="M-30,900 C220,760 560,780 830,900" fill="none" stroke="var(--gold)" stroke-width="1" opacity=".3"/>
  </svg>

  <div class="topband">
    <span class="l">奇想 · 魔幻</span>
    <span class="r">THE IN-BETWEEN</span>
  </div>

  <div class="titlewrap">
    <div class="title-en">TABLE &amp; INNER · 守界人</div>
    <div class="title-main">表里之介<span class="sub">BETWEEN TWO WORLDS</span></div>
  </div>

  <div class="tagline">
    <div class="rule"></div>
    <div class="txt">
      <div class="ln">生于明暗交界，<b>守两个世界之门</b>。<br>表是水上的城，里是云端的光。</div>
    </div>
  </div>

  <div class="credits">
    <span class="c">表里之介 · 壹</span>
    <span class="ce">ORIGINAL SERIES</span>
  </div>
</div>
</body>
</html>
